# web 與 worker 必須跑在完全相同的設定下。兩邊各寫一份環境變數是很難查的 bug 來源 ——
# 症狀會是「web 連得到 Redis，worker 連不到」，而兩個檔案看起來都沒錯。
x-backend-env: &backend-env
    APP_ENV: local
    APP_DEBUG: "true"
    FRONTEND_URL: http://localhost:5173
    DB_CONNECTION: mysql
    DB_HOST: mysql
    DB_PORT: 3306
    DB_DATABASE: sporpulation
    DB_USERNAME: sporpulation
    DB_PASSWORD: secret
    CACHE_STORE: redis
    QUEUE_CONNECTION: redis
    SESSION_DRIVER: redis
    REDIS_CLIENT: phpredis
    REDIS_HOST: redis
    REDIS_PORT: 6379
    REDIS_IDEMPOTENCY_DB: 2
    MAIL_MAILER: smtp
    MAIL_HOST: mailpit
    MAIL_PORT: 1025
    MAIL_FROM_ADDRESS: no-reply@sporpulation.test

services:
    backend:
        build:
            context: ./backend
            dockerfile: Dockerfile
        image: sporpulation-backend
        ports:
            - "8080:80"
        environment:
            <<: *backend-env
            # 佇列由獨立的 queue-worker service 處理，因此關掉容器內建的那個。
            # 單容器部署（Render 等）不設這個變數，映像的預設值 true 會生效。
            QUEUE_IN_WEB: "false"
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_healthy
            mailpit:
                condition: service_healthy
        volumes:
            - storage_data:/var/www/html/storage
        healthcheck:
            # queue-worker 等這個通過才啟動 —— 代表 entrypoint 的 migrate 已經跑完。
            test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1/up') === false ? 1 : 0);"]
            interval: 5s
            timeout: 5s
            retries: 20

    queue-worker:
        build:
            context: ./backend
            dockerfile: Dockerfile
        image: sporpulation-backend
        restart: unless-stopped
        # 覆寫映像的 CMD（supervisord），entrypoint 仍然會執行。
        # --max-time 讓行程每小時自我回收：長壽的 PHP worker 會累積記憶體，而且
        # 會一直抱著啟動當下載入的程式碼。
        # --timeout 必須小於 config/queue.php 的 retry_after（90 秒），否則佇列會在
        # Job 還在跑的時候就重新投遞，同一個 Job 出現兩個行程。這裡寫出來只是為了
        # 讓這個關係看得見 —— 60 本來就是預設值。
        #
        # 降權到 www-data，與 backend 容器裡 supervisord 的 user=www-data 一致：兩邊
        # 共用同一個 storage volume，任何一邊用 root 建立檔案，另一邊就再也寫不進去。
        # 用 `su ... exec` 而不是 compose 的 user: —— entrypoint 需要 root 才能建立
        # .env 與修正 volume 的擁有者，而 exec 會讓 PHP 取代整個行程，Docker 的
        # SIGTERM 才送得到 queue:work，讓它把手上的 Job 做完再退出。
        command: su -s /bin/sh www-data -c "exec php artisan queue:work --tries=3 --backoff=10 --timeout=60 --max-time=3600"
        environment:
            <<: *backend-env
            # migrate 與 seed 是整個叢集做一次的事，但 entrypoint 是每個容器都跑。
            # 兩個容器同時 migrate 會互相打架 —— 單一容器時看不出來，加第二個才浮現。
            RUN_MIGRATIONS: "false"
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_healthy
            backend:
                condition: service_healthy
            mailpit:
                condition: service_healthy
        volumes:
            # 與 backend 共用：兩邊都會寫 storage/logs，必須是同一份，而且擁有者
            # 要一致（見 command 的降權說明）。
            - storage_data:/var/www/html/storage

    frontend:
        build:
            context: ./frontend
            dockerfile: Dockerfile
            args:
                # 會在建置時直接打包進 bundle，而 .env 已被 .dockerignore 排除 -
                # 少了這個，建置出來的應用程式就沒有 API base URL，所有呼叫都會退回
                # 打到自己的來源網域。
                VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/api}
        image: sporpulation-frontend
        ports:
            - "5173:80"
        depends_on:
            - backend

    mysql:
        image: mysql:8.4
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: sporpulation
            MYSQL_USER: sporpulation
            MYSQL_PASSWORD: secret
            MYSQL_ROOT_PASSWORD: root
        ports:
            - "3306:3306"
        volumes:
            - mysql_data:/var/lib/mysql
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
            interval: 5s
            timeout: 5s
            retries: 10

    redis:
        image: redis:7-alpine
        restart: unless-stopped
        ports:
            - "6379:6379"
        volumes:
            - redis_data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 5s
            retries: 10

    # 本機用的真 SMTP 伺服器，收到的信可以在 http://localhost:8025 看。
    # 用它而不是 MAIL_MAILER=log，是因為 log driver 寫檔案是微秒級的 —— 那樣
    # 「把寄信搬離請求路徑」的效益會淹沒在雜訊裡，量不出東西來。
    mailpit:
        image: axllent/mailpit:latest
        restart: unless-stopped
        ports:
            - "8025:8025"   # Web UI
        healthcheck:
            test: ["CMD", "/mailpit", "readyz"]
            interval: 5s
            timeout: 5s
            retries: 10

volumes:
    mysql_data:
    storage_data:
    redis_data:
