[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0

[program:php-fpm]
command=php-fpm
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; schedule:work is the container-friendly form of the cron entry: it stays in
; the foreground and fires due tasks every minute. Without it nothing in
; routes/console.php ever runs - expired idempotency keys would accumulate
; forever.
[program:schedule]
command=php /var/www/html/artisan schedule:work
user=www-data
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; QUEUE_CONNECTION is redis, so without this a dispatched job would sit in
; Redis and never run - silently, the same way the scheduler failed.
; --max-time recycles the worker hourly so a long-lived process cannot leak,
; and stopwaitsecs gives whatever job is in hand time to finish before
; supervisor kills it on shutdown.
;
; QUEUE_IN_WEB decides whether this container processes jobs itself. Compose
; sets it to false and runs a separate queue-worker service, so web and worker
; can be scaled apart. A single-container deployment leaves it at the image
; default of true - otherwise jobs would queue up and never run, silently.
; The variable must exist or supervisor fails to parse this file; the Dockerfile
; supplies the default.
[program:queue]
command=php /var/www/html/artisan queue:work --tries=3 --max-time=3600
user=www-data
autostart=%(ENV_QUEUE_IN_WEB)s
autorestart=true
stopwaitsecs=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
