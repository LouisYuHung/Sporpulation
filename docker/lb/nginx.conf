# 前置的負載平衡，讓 backend 可以 --scale 成多個節點。
#
# nginx 在「載入設定時」解析 backend 這個名稱，Docker 的內嵌 DNS 會回傳所有 replica
# 的 IP，nginx 把它們展開成多個 upstream server。代價是解析只發生一次：backend 重啟
# 拿到新 IP 之後，nginx 仍然握著舊位址。正式環境要嘛用支援動態解析的方案（Traefik、
# Envoy、nginx plus 的 resolve），要嘛在節點變動時重載 nginx。
#
# least_conn 而不是預設的 round-robin：報名請求的耗時不平均，把請求送給「目前手上最少」
# 的節點比輪流更能避免長尾。
#
# 這裡原本寫的理由是「撞上唯一鍵而 rollback 的比成功的快得多」。指標上線後量出來方向
# 剛好相反：6490 筆觀測裡，rejected 平均 13.0ms、p95 45.2ms，granted 平均 11.2ms、
# p95 30.8ms —— rollback 不是免費的。
#
# 選擇仍然對（不平均就值得 least_conn，方向不影響結論），但當初那個理由是憑直覺寫的。
# 見 README「指標推翻了我自己寫下的假設」。
# 追蹤用的識別碼在最外層決定。放在這裡而不是 Laravel 裡，是因為「沒有進到 app 的
# 請求」—— 502、504、被 nginx 自己擋掉的 —— 也需要 id，而那些正好是最難查的。
#
# 呼叫端帶了合法形狀的 id 就沿用（跨服務的追蹤才連得起來），否則用 nginx 內建的
# $request_id 產一個。這裡的正規表達式必須和 AssignRequestId 的那條一致：邊界檢查
# 分散在兩個地方而規則不同，是很典型的漏洞來源。
map $http_x_request_id $trace_id {
    "~^[A-Za-z0-9._-]{1,64}$"  $http_x_request_id;
    default                    $request_id;
}

# 存取紀錄也結構化，欄位對齊應用程式的 log，兩邊用 request_id 對得起來。
#
# request_time 與 upstream_time 分開記，是 M4 那個被推翻的效能假設留下來的教訓：
# 前者含用戶端傳輸，後者只含後端處理。兩者差很多就代表瓶頸不在後端 —— 有這兩個
# 數字，當時就不會把「fpm worker 不夠」當成結論了。
log_format json_edge escape=json '{'
    '"ts":"$time_iso8601",'
    '"request_id":"$trace_id",'
    '"method":"$request_method",'
    '"path":"$uri",'
    '"status":$status,'
    '"upstream":"$upstream_addr",'
    '"upstream_status":"$upstream_status",'
    '"request_time":$request_time,'
    '"upstream_time":"$upstream_response_time",'
    '"bytes":$body_bytes_sent,'
    '"client":"$remote_addr"'
'}';

upstream app {
    least_conn;
    server backend:80;

    # 與後端保持長連線，省掉每個請求的 TCP 三次握手。沒有這個的話，壓測量到的
    # 延遲有一部分是 nginx 自己在建連線。
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 100M;

    access_log /dev/stdout json_edge;

    # 指標端點不對外。它會說出叢集的內部狀態 —— 有多少報名、有多少被限流擋下、
    # 佇列積壓多長 —— 那些是給營運看的，不是給使用者看的。
    #
    # Prometheus 不受影響：它和 backend 在同一個 Docker 網路裡，直接抓
    # backend:80 就好，根本不需要經過這台 lb。
    #
    # 回 404 而不是 403：403 等於承認「這裡有東西，只是你不能看」。
    #
    # location = 是精確匹配，優先序高於下面的前綴匹配 location /，所以順序不影響
    # 結果 —— 但寫在前面比較讀得出意圖。
    location = /api/metrics {
        return 404;
    }

    location / {
        proxy_pass http://app;

        proxy_set_header X-Request-Id $trace_id;

        # keepalive 需要 HTTP/1.1，而且要清掉 Connection 標頭 —— 預設會送
        # "Connection: close"，上面那個 keepalive 就完全沒有作用。
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 讓回應說出自己是哪個節點處理的。跨節點壓測若少了這個，你無法分辨
        # 「請求真的分散到多台」還是「其實全部打在同一台」。
        add_header X-Served-By $upstream_addr always;

        # 後端也會回一個 X-Request-Id（同樣的值）。先藏掉再自己加，否則用戶端會
        # 收到兩個同名標頭。always 讓 502／504 這種根本沒到後端的回應也帶得到 id
        # —— 那正是最需要它的時候。
        proxy_hide_header X-Request-Id;
        add_header X-Request-Id $trace_id always;
    }
}
